<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Escolar</title>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f2f2f2;
  padding: 20px;
  transition: .3s;
}
body.dark {
  background: #121212;
  color: #eee;
}

h1 { text-align: center; }

button {
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background: dodgerblue;
  color: white;
  cursor: pointer;
  margin-left: 5px;
}

button.removeBtn { background: red; }
button.pdfBtn { background: #3c9; }

#calendario, #agenda, #loginBox {
  background: white;
  padding: 20px;
  border-radius: 15px;
  max-width: 500px;
  margin: auto;
  box-shadow: 0 0 10px rgba(0,0,0,.2);
}

body.dark #calendario,
body.dark #agenda,
body.dark #loginBox {
  background: #1e1e1e;
}

#topoCal {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

select {
  padding: 8px;
  border-radius: 8px;
  width: 100%;
}

#dias {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(45px, 1fr));
  gap: 10px;
}

.dia {
  padding: 12px;
  background: #e5e5e5;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
}

body.dark .dia {
  background: #2a2a2a;
}

.comTarefa {
  background: #6aff6a !important;
  font-weight: bold;
}

#agenda {
  display: none;
  margin-top: 25px;
}

.tarefa, .aviso {
  background: #e4e4e4;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}

body.dark .tarefa, body.dark .aviso {
  background: #2a2a2a;
}

#inputBox, #inputAviso {
  display: flex;
  gap: 5px;
  margin-bottom: 10px;
}

input[type="text"] {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #aaa;
}

#loginBox input {
  width: 100%;
  margin-top: 8px;
}

/* FRAME AVISOS */
#avisosFrame {
  position: fixed;
  top: 10%;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 400px;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 0 15px rgba(0,0,0,.3);
  display: none;
  z-index: 1000;
}

body.dark #avisosFrame { background: #1e1e1e; }

#avisosFrame h3 { margin-top:0; }

/* BOTÃO AVISOS NO CANTO */
#btnAvisos {
  position: fixed;
  bottom: 15px;
  right: 15px;
  background: orange;
  color: white;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  font-size: 20px;
  cursor: pointer;
  z-index: 999;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
}
</style>
</head>

<body>

<div style="position: fixed;top: 5px;left: 10px;font-size: 12px;color: #555;opacity: .8;font-weight: 600;">
  melhor turma 😝
</div>
<div style="position: fixed;top: 5px;right: 10px;font-size: 12px;color: #555;opacity: .8;font-weight: 600;">
  v2.0.1
</div>

<h1>📅 Agenda 8 Ano G</h1>

<!-- LOGIN ADMIN -->
<div id="loginBox">
  <h3>Login Admin</h3>
  <input id="senhaAdm" type="password" placeholder="Digite a senha de admin">
  <button onclick="loginAdmin()">Entrar</button>
  <p id="msgAdm" style="color:red;"></p>
</div>

<!-- AGENDA -->
<div id="calendario">
  <div id="topoCal">
    <select id="mesSelect"></select>
    <select id="anoSelect"></select>
  </div>
  <div id="dias"></div>
</div>

<div id="agenda">
  <h3 id="tituloDia"></h3>
  <div id="inputBox" style="display:none;">
    <input id="novaTarefa" type="text" placeholder="Nova tarefa">
    <button onclick="addTarefa()">+</button>
  </div>
  <div id="tarefas"></div>
</div>

<!-- FRAME AVISOS -->
<div id="avisosFrame">
  <h3>Avisos Gerais</h3>
  <div id="avisosList"></div>
  <div id="inputAviso" style="display:none; margin-top:10px;">
    <input id="novaAviso" placeholder="Novo aviso">
    <button onclick="addAviso()">Adicionar</button>
  </div>
  <button onclick="fecharAvisos()">Fechar</button>
</div>

<!-- BOTÃO AVISOS -->
<div id="btnAvisos" onclick="abrirAvisos()">📢</div>

<div style="text-align:center;margin-top:10px;">
  <button onclick="toggleDark()">🌙 Modo Noturno</button>
</div>

<script>
// SENHA ATUALIZADA
const dbURL = "https://tarefashcr-default-rtdb.firebaseio.com";
const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const SENHA_ADMIN = "admin2526"; // <--- nova senha

const mesSelect = document.getElementById("mesSelect");
const anoSelect = document.getElementById("anoSelect");
const diasDiv = document.getElementById("dias");
const agenda = document.getElementById("agenda");
const tituloDia = document.getElementById("tituloDia");
const tarefasEl = document.getElementById("tarefas");
const inputBox = document.getElementById("inputBox");
const loginBox = document.getElementById("loginBox");
const msgAdm = document.getElementById("msgAdm");

const avisosFrame = document.getElementById("avisosFrame");
const avisosList = document.getElementById("avisosList");
const inputAviso = document.getElementById("inputAviso");

let diaSelecionado = "";
let isAdmin = false;

function toggleDark(){ document.body.classList.toggle("dark"); }

function loginAdmin(){
  const senha = document.getElementById("senhaAdm").value;
  if(senha===SENHA_ADMIN){
    isAdmin=true;
    loginBox.style.display="none";
    inputBox.style.display="flex";
    inputAviso.style.display="flex";
  } else { msgAdm.textContent="Senha incorreta!"; }
}

// MESMAS FUNÇÕES DE CALENDÁRIO, TAREFAS E AVISOS (idênticas ao código anterior)

function carregarSeletores(){
  meses.forEach((m,i)=>{
    const o=document.createElement("option");
    o.value=i; o.textContent=m;
    mesSelect.appendChild(o);
  });
  const anoAtual = new Date().getFullYear();
  for(let a=anoAtual-3;a<=anoAtual+3;a++){
    const o=document.createElement("option");
    o.value=a; o.textContent=a;
    anoSelect.appendChild(o);
  }
  mesSelect.value=new Date().getMonth();
  anoSelect.value=anoAtual;
  gerarCalendario();
}

async function gerarCalendario(){
  diasDiv.innerHTML="";
  const mes=parseInt(mesSelect.value);
  const ano=parseInt(anoSelect.value);
  const ultimo=new Date(ano,mes+1,0).getDate();
  for(let d=1;d<=ultimo;d++){
    const div=document.createElement("div");
    div.className="dia"; div.textContent=d;
    div.onclick=()=>abrirAgenda(d,mes,ano);
    diasDiv.appendChild(div);
  }
  marcarDias(mes,ano);
}

async function marcarDias(mes,ano){
  const dias=document.querySelectorAll(".dia");
  for(let i=0;i<dias.length;i++){
    const chave=`${i+1}-${mes+1}-${ano}`;
    const r=await fetch(`${dbURL}/tarefas/${chave}.json`);
    if(await r.json()) dias[i].classList.add("comTarefa");
  }
}

function abrirAgenda(d,mes,ano){
  diaSelecionado=`${d}-${mes+1}-${ano}`;
  tituloDia.textContent=`Tarefas de ${diaSelecionado}`;
  agenda.style.display="block";
  inputBox.style.display = isAdmin ? "flex" : "none";
  carregarTarefas();
}

async function carregarTarefas(){
  tarefasEl.innerHTML="";
  const r=await fetch(`${dbURL}/tarefas/${diaSelecionado}.json`);
  const dados=await r.json()||{};
  Object.entries(dados).forEach(([id,t])=>{
    const div=document.createElement("div"); div.className="tarefa";
    const span=document.createElement("span"); span.textContent=t.texto;
    div.appendChild(span);

    if(isAdmin){
      const inputPdf=document.createElement("input");
      inputPdf.type="file"; inputPdf.accept="application/pdf";
      inputPdf.onchange=e=>uploadPDF(diaSelecionado,id,e.target.files[0]);
      div.appendChild(inputPdf);

      const btnDel=document.createElement("button");
      btnDel.textContent="❌"; btnDel.className="removeBtn";
      btnDel.onclick=async ()=>{
        await fetch(`${dbURL}/tarefas/${diaSelecionado}/${id}.json`,{method:"DELETE"});
        carregarTarefas(); gerarCalendario();
      };
      div.appendChild(btnDel);
    }
    tarefasEl.appendChild(div);
  });
}

async function addTarefa(){
  if(!isAdmin || !novaTarefa.value) return;
  await fetch(`${dbURL}/tarefas/${diaSelecionado}.json`,{
    method:"POST", body:JSON.stringify({texto:novaTarefa.value})
  });
  novaTarefa.value="";
  carregarTarefas(); gerarCalendario();
}

async function uploadPDF(chave,id,file){
  const reader=new FileReader();
  reader.onload=async ()=>{
    const pdfBase64=reader.result;
    const old=await fetch(`${dbURL}/tarefas/${chave}/${id}.json`).then(r=>r.json());
    await fetch(`${dbURL}/tarefas/${chave}/${id}.json`,{
      method:"PATCH", body: JSON.stringify({texto:old.texto, pdfBase64})
    });
    carregarTarefas();
  };
  reader.readAsDataURL(file);
}

function abrirAvisos(){ avisosFrame.style.display="block"; carregarAvisos(); }
function fecharAvisos(){ avisosFrame.style.display="none"; }

async function carregarAvisos(){
  avisosList.innerHTML="";
  const r = await fetch(`${dbURL}/avisos.json`);
  const dados = await r.json()||{};
  Object.entries(dados).forEach(([id,a])=>{
    const div=document.createElement("div"); div.className="aviso";
    div.textContent = `[${a.data}] ${a.texto}`;
    if(isAdmin){
      const btnDel=document.createElement("button");
      btnDel.textContent="❌"; btnDel.className="removeBtn";
      btnDel.onclick=async ()=>{
        await fetch(`${dbURL}/avisos/${id}.json`,{method:"DELETE"});
        carregarAvisos();
      };
      div.appendChild(btnDel);
    }
    avisosList.appendChild(div);
  });
}

async function addAviso(){
  const texto=novaAviso.value.trim();
  if(!texto) return;
  const data = new Date().toLocaleDateString();
  await fetch(`${dbURL}/avisos.json`,{
    method:"POST",
    body: JSON.stringify({ texto, data })
  });
  novaAviso.value="";
  carregarAvisos();
}

mesSelect.onchange=gerarCalendario;
anoSelect.onchange=gerarCalendario;
carregarSeletores();
</script>
</body>
  </html>
